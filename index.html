<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard & Vochtmonitor Schil</title>
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%230056b3'/><text x='50%' y='52%' font-size='180' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>APP</text></svg>">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%230056b3'/><text x='50%' y='52%' font-size='180' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>APP</text></svg>">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #0056b3;
      --primary-dark: #004090;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    #authContainer, #pendingContainer { width: 100%; max-width: 400px; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; text-align: center; }
    #authContainer h2, #pendingContainer h2 { color: var(--primary); margin-bottom: 20px; }
    .auth-form-group { margin-bottom: 15px; display: flex; flex-direction: column; text-align: left; }
    .auth-form-group label { font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    .auth-form-group input { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; }
    
    #appContainer { width: 100%; max-width: 1200px; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: none; }
    
    .app-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .app-header h1 { color: var(--primary); font-size: 1.4rem; }
    .user-info { display: flex; align-items: center; gap: 15px; font-size: 0.9rem; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: #e2e8f0; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: background 0.2s; display: none; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-btn.admin-tab { background: #e0e7ff; color: #3730a3; }
    .tab-btn.admin-tab.active { background: #3730a3; color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: bold; width: 100%; transition: background 0.2s; }
    .btn:hover { background: var(--primary-dark); }
    .btn-danger { background: var(--danger); width: auto; padding: 6px 12px; font-size: 0.85rem; }
    .btn-danger:hover { background: #bd2130; }
    .btn-warning { background: var(--warning); color: #000; width: auto; padding: 6px 12px; font-size: 0.85rem; }

    /* Iframe Styling voor de Standby/Online App */
    .app-iframe { width: 100%; height: 75vh; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; }

    .table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: var(--primary); color: white; }
    tr:nth-child(even) { background: #f8fafc; }

    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; color: white; font-size: 0.75rem; }
    .bg-admin { background-color: #3730a3; }
    .bg-user { background-color: #059669; }
    .bg-pending { background-color: #d97706; }
    select.perm-select { padding: 4px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 0.8rem; }
  </style>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0056b3">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

  <!-- INLOGSCHERM -->
  <div id="authContainer">
    <h2 id="authTitle">Inloggen</h2>
    <div class="auth-form-group">
      <label>E-mailadres</label>
      <input type="email" id="authEmail" placeholder="naam@voorbeeld.nl">
    </div>
    <div class="auth-form-group">
      <label>Wachtwoord</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>
    <button class="btn" id="authSubmitBtn" onclick="handleAuthSubmit()" style="margin-bottom: 10px;">Inloggen</button>
    <p style="text-align: center; font-size: 0.85rem; cursor: pointer; color: var(--primary);" onclick="toggleAuthMode()">
      <span id="authToggleText">Nog geen account? Registreer hier</span>
    </p>
    <p id="authError" style="color: var(--danger); font-size: 0.85rem; text-align: center; margin-top: 10px;"></p>
  </div>

  <!-- STANDBY SCHERM -->
  <div id="pendingContainer">
    <h2>Account in afwachting</h2>
    <p style="margin-bottom: 20px; color: #64748b; font-size: 0.95rem;">Je account is geregistreerd, maar staat op **Standby**. De beheerder moet je account eerst goedkeuren.</p>
    <button class="btn btn-danger" onclick="logout()">Uitloggen</button>
  </div>

  <!-- HOOFD APP SCHERM (SCHIL) -->
  <div id="appContainer">
    <div class="app-header">
      <h1>Dashboard & Programma Schil</h1>
      <div class="user-info">
        <span id="userEmailDisplay">Welkom</span>
        <button class="btn btn-danger" onclick="logout()">Uitloggen</button>
      </div>
    </div>

    <!-- Navigatie Tabbladen -->
    <div class="nav-tabs" id="navTabsContainer">
      <button class="tab-btn" id="tabBtnVocht" onclick="switchTab('vochtTab', this)">Vochtmonitor App</button>
      <button class="tab-btn admin-tab" id="adminTabBtn" onclick="switchTab('adminTab', this)">Gebruikersbeheer (Admin)</button>
    </div>

    <!-- VOCHTMONITOR VIA URL (IFRAME) -->
    <div id="vochtTab" class="tab-content">
      <iframe src="https://luuk57.github.io/Drinken/" class="app-iframe" title="Vochtmonitor"></iframe>
    </div>

    <!-- BEHEER TAB (Admin) -->
    <div id="adminTab" class="tab-content">
      <h3 style="margin-bottom: 15px; color: var(--primary);">Gebruikersbeheer & Rechten</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>E-mailadres</th>
              <th>Status</th>
              <th>Rol</th>
              <th>Vochtmonitor Recht</th>
              <th>Acties</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="5" style="text-align:center;">Laden...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(e => console.log(e));
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBWaKFaJ1sUhSvXqK2pOCSDwJ3eMqDJag8",
    authDomain: "dialysedbase.firebaseapp.com",
    projectId: "dialysedbase",
    storageBucket: "dialysedbase.firebasestorage.app",
    messagingSenderId: "36507381882",
    appId: "1:36507381882:web:6cf9725f87c963c51ccbc3"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let isRegisterMode = false;
  let currentUser = null;
  let currentUserData = null;

  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('pendingContainer').style.display = 'none';
      document.getElementById('appContainer').style.display = 'none';
      checkUserAccess(user);
    } else {
      currentUser = null;
      currentUserData = null;
      document.getElementById('appContainer').style.display = 'none';
      document.getElementById('pendingContainer').style.display = 'none';
      document.getElementById('authContainer').style.display = 'block';
    }
  });

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('authTitle').innerText = isRegisterMode ? 'Account Registreren' : 'Inloggen';
    document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Registreren' : 'Inloggen';
    document.getElementById('authToggleText').innerText = isRegisterMode ? 'Al een account? Log hier in' : 'Nog geen account? Registreer hier';
    document.getElementById('authError').innerText = '';
  }

  function handleAuthSubmit() {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.innerText = '';

    if (!email || !password) { errEl.innerText = 'Vul alle velden in.'; return; }

    if (isRegisterMode) {
      auth.createUserWithEmailAndPassword(email, password)
        .then(cred => {
          return db.collection('users').doc(cred.user.uid).set({
            email: email,
            status: 'pending',
            role: 'user',
            permissions: { vocht: 'write' },
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        })
        .catch(err => errEl.innerText = err.message);
    } else {
      auth.signInWithEmailAndPassword(email, password)
        .catch(err => errEl.innerText = err.message);
    }
  }

  function logout() { auth.signOut(); }

  function checkUserAccess(user) {
    db.collection('users').doc(user.uid).get().then(doc => {
      if (doc.exists) {
        currentUserData = doc.data();
        if (currentUserData.role === 'admin' || currentUserData.status === 'active') {
          showApp(user.email);
        } else {
          document.getElementById('pendingContainer').style.display = 'block';
        }
      } else {
        db.collection('users').doc(user.uid).set({
          email: user.email,
          status: 'pending',
          role: 'user',
          permissions: { vocht: 'write' },
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          document.getElementById('pendingContainer').style.display = 'block';
        });
      }
    });
  }

  function showApp(email) {
    document.getElementById('appContainer').style.display = 'block';
    document.getElementById('userEmailDisplay').innerText = email;

    const isAdmin = currentUserData.role === 'admin';
    const vochtPerm = currentUserData.permissions ? currentUserData.permissions.vocht : 'none';

    const tabVocht = document.getElementById('tabBtnVocht');
    if (isAdmin || vochtPerm !== 'none') {
      tabVocht.style.display = 'block';
      switchTab('vochtTab', tabVocht);
    } else {
      tabVocht.style.display = 'none';
    }

    const adminTab = document.getElementById('adminTabBtn');
    if (isAdmin) {
      adminTab.style.display = 'block';
      loadAllUsersForAdmin();
      if (tabVocht.style.display === 'none') {
        switchTab('adminTab', adminTab);
      }
    } else {
      adminTab.style.display = 'none';
    }
  }

  function loadAllUsersForAdmin() {
    db.collection('users').get().then(snapshot => {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';
      snapshot.forEach(doc => {
        let u = doc.data();
        let uid = doc.id;
        let statusBadge = u.status === 'active' ? `<span class="badge bg-admin">Actief</span>` : `<span class="badge bg-pending">Standby</span>`;
        let roleBadge = u.role === 'admin' ? `<span class="badge bg-admin">Admin</span>` : `<span class="badge bg-user">User</span>`;
        let p = u.permissions || { vocht: 'none' };

        tbody.innerHTML += `
          <tr>
            <td>${u.email}</td>
            <td>${statusBadge}</td>
            <td>${roleBadge}</td>
            <td>
              <select class="perm-select" onchange="updateUserPerm('${uid}', this.value)">
                <option value="none" ${p.vocht==='none'?'selected':''}>Geen</option>
                <option value="read" ${p.vocht==='read'?'selected':''}>Lezen</option>
                <option value="write" ${p.vocht==='write'?'selected':''}>Schrijven</option>
              </select>
            </td>
            <td>
              ${u.status === 'pending' ? `<button class="btn btn-warning" onclick="setUserStatus('${uid}', 'active')">Goedkeuren</button>` : `<button class="btn btn-danger" onclick="setUserStatus('${uid}', 'pending')">Blokkeren</button>`}
            </td>
          </tr>`;
      });
    });
  }

  function setUserStatus(uid, status) {
    db.collection('users').doc(uid).update({ status: status }).then(loadAllUsersForAdmin);
  }

  function updateUserPerm(uid, val) {
    db.collection('users').doc(uid).get().then(doc => {
      let p = doc.data().permissions || {};
      p.vocht = val;
      db.collection('users').doc(uid).update({ permissions: p });
    });
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }
</script>

</body>
</html>
